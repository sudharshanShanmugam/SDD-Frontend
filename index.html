<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="SDD Platform - AI-Powered Software Design Document Management" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Inter Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- JetBrains Mono for code -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>SDD Platform | AI-Powered Requirements Management</title>

    <style>
      /* Critical CSS - prevent FOUC */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #F8FAFC;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        min-height: 100vh;
      }

      /* Loading spinner */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F8FAFC;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #E0E7FF;
        border-top-color: #4F46E5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .loading-logo-text {
        font-size: 1.5rem;
        font-weight: 700;
        color: #4F46E5;
        letter-spacing: -0.025em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Initial loading state -->
    <div id="app-loading">
      <div class="loading-logo">
        <div class="loading-spinner"></div>
        <span class="loading-logo-text">SDD Platform</span>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Remove loading screen once React mounts
      window.__APP_LOADED__ = function() {
        const loader = document.getElementById('app-loading');
        if (loader) {
          loader.classList.add('hidden');
          setTimeout(() => loader.remove(), 300);
        }
      };
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
